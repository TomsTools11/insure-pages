document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

-height:1.06;letter-spacing:-.032em;font-weight:500;margin-bottom:20px\">Two storefronts, nine agents, one phone number that gets answered<\u002Fh2>\n<p style=\"font-size:16px;line-height:1.65;color:#5C5D56;margin-bottom:16px\">Northgate opened on Fifth Street in 1998 with one desk and one carrier appointment. We're independent, which means we don't work for an insurance company — we work for the person sitting across the table, and we can move your policy the moment a better fit shows up.<\u002Fp>\n<p style=\"font-size:16px;line-height:1.65;color:#5C5D56;margin-bottom:30px\">Every household gets a named agent, a direct line, and a coverage review each year whether or not anything changed.<\u002Fp>\n<dl style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:20px;padding:24px 0;border-top:1px solid rgba(20,21,15,.1);border-bottom:1px solid rgba(20,21,15,.1);margin:0 0 28px\">\n<div><dt style=\"font-family:'DM Mono',ui-monospace,monospace;font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:#6A6B63;margin-bottom:6px\">Licensed in<\u002Fdt><dd style=\"margin:0;font-size:22px;font-weight:600;letter-spacing:-.02em\">6 states<\u002Fdd><\u002Fdiv>\n<div><dt style=\"font-family:'DM Mono',ui-monospace,monospace;font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:#6A6B63;margin-bottom:6px\">Licensed agents<\u002Fdt><dd style=\"margin:0;font-size:22px;font-weight:600;letter-spacing:-.02em\">9 on staff<\u002Fdd><\u002Fdiv>\n<div><dt style=\"font-family:'DM Mono',ui-monospace,monospace;font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:#6A6B63;margin-bottom:6px\">Carrier partners<\u002Fdt><dd style=\"margin:0;font-size:22px;font-weight:600;letter-spacing:-.02em\">12 appointed<\u002Fdd><\u002Fdiv>\n<\u002Fdl>\n<a href=\"#quote\" style=\"display:inline-flex;align-items:center;gap:11px;padding:9px 10px 9px 20px;background:#14150F;color:#fff;border-radius:999px;font-size:15px;font-weight:500\" style-hover=\"background:#2C60F0\">Meet your agent\n<span style=\"width:28px;height:28px;border-radius:50%;background:rgba(255,255,255,.18);display:grid;place-items:center\"><svg width=\"12\" height=\"12\" sc-camel-view-box=\"0 0 12 12\" fill=\"none\" aria-hidden=\"true\"><path d=\"M2 6h8M6.5 2.5 10 6l-3.5 3.5\" stroke=\"currentColor\" stroke-width=\"1.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><\u002Fpath><\u002Fsvg><\u002Fspan>\n<\u002Fa>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n\n<section aria-labelledby=\"why-h\" style=\"max-width:1280px;margin:0 auto;padding:clamp(40px,6vw,80px) clamp(18px,4vw,48px)\">\n<div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:clamp(28px,4vw,56px);align-items:start\">\n<div style=\"min-width:0;position:sticky;top:100px\">\n<p style=\"display:inline-flex;align-items:center;gap:8px;padding:6px 14px 6px 11px;border:1px solid rgba(20,21,15,.16);border-radius:999px;font-family:'DM Mono',ui-monospace,monospace;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:#5C5D56;margin-bottom:20px\">\n<span style=\"width:6px;height:6px;background:#7A3CE8;border-radius:50%;display:block\"><\u002Fspan>Why independent<\u002Fp>\n<h2 id=\"why-h\" style=\"font-size:clamp(30px,4vw,48px);line-height:1.06;letter-spacing:-.032em;font-weight:500;margin-bottom:18px\">When something happens, you shouldn't be on hold<\u002Fh2>\n<p style=\"font-size:16px;line-height:1.6;color:#5C5D56;max-width:44ch;margin-bottom:30px\">A captive agent has one shelf to sell from. We have twelve — and we're the ones who call the adjuster when a claim stalls.<\u002Fp>\n<a href=\"#quote\" style=\"display:inline-flex;align-items:center;gap:11px;padding:9px 10px 9px 20px;background:#7A3CE8;color:#fff;border-radius:999px;font-size:15px;font-weight:500\" style-hover=\"background:#6A2ED6\">Start a comparison\n<span style=\"width:28px;height:28px;border-radius:50%;background:rgba(255,255,255,.2);display:grid;place-items:center\"><svg width=\"12 5,255,255,.2);border-radius:999px;font-family:'DM Mono',ui-monospace,monospace;font-size:10px;letter-spacing:.09em;text-transform:uppercase\">Claims<\u002Fspan>\n<h3 style=\"font-size:18px;font-weight:600;letter-spacing:-.02em;line-height:1.2\">We advocate, start to finish<\u002Fh3>\n<p style=\"font-size:13.5px;line-height:1.55;color:rgba(255,255,255,.92)\">Filed, tracked and escalated by us. If an estimate looks short, we're the ones pushing back.<\u002Fp>\n<\u002Fli>\n<li style=\"background:#C3D3FB;border-radius:20px;padding:22px;color:#14150F;min-height:186px;display:flex;flex-direction:column;gap:12px\">\n<span style=\"align-self:flex-start;padding:5px 11px;background:rgba(20,21,15,.1);border-radius:999px;font-family:'DM Mono',ui-monospace,monospace;font-size:10px;letter-spacing:.09em;text-transform:uppercase\">Every year<\u002Fspan>\n<h3 style=\"font-size:18px;font-weight:600;letter-spacing:-.02em;line-height:1.2\">Re‑shopped at renewal<\u002Fh3>\n<p style=\"font-size:13.5px;line-height:1.55;color:#4A4B45\">Rates drift. Before each renewal we re‑quote your file and tell you if moving is worth it.<\u002Fp>\n<\u002Fli>\n<\u002Ful>\n<\u002Fdiv>\n<\u002Fsection>\n\n<section aria-labelledby=\"steps-h\" style=\"max-width:1280px;margin:0 auto;padding:clamp(40px,6vw,80px) clamp(18px,4vw,48px)\">\n<div style=\"max-width:640px;margin-bottom:clamp(28px,4vw,44px)\">\n<p style=\"display:inline-flex;align-items:center;gap:8px;padding:6px 14px 6px 11px;border:1px solid rgba(20,21,15,.16);border-radius:999px;font-family:'DM Mono',ui-monospace,monospace;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:#5C5D56;margin-bottom:20px\">\n<span style=\"width:6px;height:6px;background:#1C5B3E;border-radius:50%;display:block\"><\u002Fspan>How it works<\u002Fp>\n<h2 id=\"steps-h\" style=\"font-size:clamp(30px,4vw,48px);line-height:1.06;letter-spacing:-.032em;font-weight:500;margin-bottom:16px\">Four steps between you and a signed policy<\u002Fh2>\n<p style=\"font-size:16px;line-height:1.6;color:#5C5D56\">No call centre, no bait rate that jumps at month seven. Most files close in a single afternoon.<\u002Fp>\n<\u002Fdiv>\n<ol style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:clamp(12px,1.4vw,18px)\">\n<li style=\"background:#2C60F0;border-radius:22px;overflow:hidden;color:#fff;display:flex;flex-direction:column\">\n<div style=\"aspect-ratio:16/10;background:rgba(255,255,255,.14);position:relative\"><image-slot id=\"is-step-1\" shape=\"rect\" placeholder=\"Illustration — intake\"><\u002Fimage-slot><\u002Fdiv>\n<div style=\"padding:22px;display:flex;flex-direction:column;gap:10px;flex:1\">\n<span style=\"align-self:flex-start;padding:5px 11px;background:rgba(255,255,255,.22);border-radius:999px;font-family:'DM Mono',ui-monospace,monospace;font-size:10px;letter-spacing:.09em;text-transform:uppercase\">Step 01<\u002Fspan>\n<h3 style=\"font-size:20px;font-weight:600;letter-spacing:-.022em;line-height:1.2\">Tell us what you're insuring<\u002Fh3>\n<p style=\"font-size:13.5px;line-height:1.55;color:rgba(255,255,255,.95)\">Five minutes online, or ten on the phone. Address, vehicles, who's on the policy — that's it to start.<\u002Fp>\n<\u002Fdiv>\n<\u002Fli>\n<li style=\"background:#4B1A3C;border-radius:22px;overflow:hidden;color:#fff;display:flex;flex-direction:column\">\n<div style=\"aspect-ratio:16/10;background:rgba(255,255,255,.12)\"><image-slot id=\"is-step-2\" shape=\"rect\" placeholder=\"Illustration — comparing\"><\u002Fimage-slot><\u002Fdiv>\n<div style=\"padding:22px;display:flex;flex-direction:column;gap:10px;flex:1\">\n<span style=\"align-self:flex-start;padding:5px 11px;background:rgba(255,255,255,.22);border-radius:999px;font-family:'DM Mono',ui-monospace,monospace;font-size:10px;letter-spacing:.09em;text-transform:uppercase\">Step 02<\u002Fspan>\n<h3 style=\"font-size:20px;font-weight:600;letter-spacing:-.022em;line-height:1.2\">We shop the whole shelf<\u002Fh3>\n<p style=\"font-size:13.5px;line-height:1.55;color:rgba(255,255,255,.92)\">Your agent runs all twelve carriers, applies every discount you qualify for, and flags coverage gaps.<\u002Fp>\n<\u002Fdiv>\n<\u002Fli>\n<li style=\"background:#1C5B3E;border-radius:22px;overflow:hidden;color:#fff;display:flex;flex-direction:column\">\n<div style=\"aspect-ratio:16/10;background:rgba(255,255,255,.12)\"><image-slot id=\"is-step-3\" shape=\"rect\" placeholder=\"Illustration — review\"><\u002Fimage-slot><\u002Fdiv>\n<div style=\"padding:22px;display:flex;flex-direction:column;gap:10px;flex:1\">\n<span style=\"align-self:flex-start;padding:5px 11px;background:rgba(255,255,255,.22);border-radius:999px;font-family:'DM Mono',ui-monospace,monospace;font-size:10px;letter-spacing:.09em;text-transform:uppercase\">Step 03<\u002Fspan>\n<h3 style=\"font-size:20px;font-weight:600;letter-spacing:-.022em;line-height:1.2\">Compare it in plain English<\u002Fh3>\n<p style=\"font-size:13.5px;line-height:1.55;color:rgba(255,255,255,.92)\">Three options, side by side, with the deductibles and exclusions translated out of policy language.<\u002Fp>\n<\u002Fdiv>\n<\u002Fli>\n<li style=\"background:#C3D3FB;border-radius:22px;overflow:hidden;color:#14150F;display:flex;flex-direction:column\">\n<div style=\"aspect-ratio:16/10;background:rgba(20,21,15,.06)\"><image-slot id=\"is-step-4\" shape=\"rect\" placeholder=\"Illustration — signed\"><\u002Fimage-slot><\u002Fdiv>\n<div style=\"padding:22px;display:flex;flex-direction:column;gap:10px;flex:1\">\n<span style=\"align-self:flex-start;padding:5px 11px;background:rgba(20,21,15,.1);border-radius:999px;font-family:'DM Mono',ui-monospace,monospace;font-size:10px;letter-spacing:.09em;text-transform:uppercase\">Step 04<\u002Fspan>\n<h3 style=\"font-size:20px;font-weight:600;letter-spacing:-.022em;line-height:1.2\">Bind it, and keep our number<\u002Fh3>\n<p style=\"font-size:13.5px;line-height:1.55;color:#4A4B45\">Sign digitally and you're covered the same day. Cards, ID and your agent's line arrive by email.<\u002Fp>\n<\u002Fdiv>\n<\u002Fli>\n<\u002Fol>\n<\u002Fsection>\n\n<section id=\"quote\" style=\"max-width:1280px;margin:0 auto;padding:clamp(40px,6vw,80px) clamp(18px,4vw,48px);scroll-margin-top:86px\">\n<div style=\"background:#fff;border-radius:28px;border:1px solid rgba(20,21,15,.08);overflow:hidden;display:grid;grid-template-columns:repeat(auto-fit,minmax(330px,1fr))\">\n<div style=\"background:#14150F;color:#fff;padding:clamp(28px,3.4vw,44px);display:flex;flex-direction:column;gap:22px\">\n<p style=\"display:inline-flex;align-items:center;gap:8px;padding:6px 14px 6px 11px;border:1px solid rgba(255,255,255,.22);border-radius:999px;font-family:'DM Mono',ui-monospace,monospace;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:rgba(255,255,255,.82);align-self:flex-start\">\n<span style=\"width:6px;height:6px;background:#7A3CE8;border-radius:50%;display:block\"><\u002Fspan>Free quote<\u002Fp>\n<h2 style=\"font-size:clamp(28px,3.2vw,40px);line-height:1.08;letter-spacing:-.03em;font-weight:500\">Twelve quotes. One form. No sales call unless you ask.<\u002Fh2>\n<p style=\"font-size:15px;line-height:1.6;color:rgba(255,255,255,.72);max-width:38ch\">Tell us a little about what you're covering and your agent will come back with real numbers — usually inside one business day.<\u002Fp>\n<ul style=\"display:grid;gap:12px;margin-top:auto\">\n<li style=\"display:flex;gap:11px;align-items:flex-start;font-size:14px;line-height:1.5;color:rgba(255,255,255,.86)\"><span style=\"width:18px;height:18px;border-radius:50%;background:#1C5B3E;display:grid;place-items:center;flex:none;margin-top:1px\"><svg width=\"10\" height=\"10\" sc-camel-view-box=\"0 0 12 12\" fill=\"none\" aria-hidden=\"true\"><path d=\"M2.5 6.2 4.8 8.5 9.5 3.8\" stroke=\"#fff\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><\u002Fpath><\u002Fsvg><\u002Fspan>No credit pull to get a quote<\u002Fli>\n<li style=\"display:flex;gap:11px;align-items:flex-start;font-s  She handled the parts I didn't understand.<\u002Fblockquote>\n<figcaption style=\"display:flex;align-items:center;gap:12px;padding-top:16px;border-top:1px solid rgba(255,255,255,.2)\">\n<span aria-hidden=\"true\" style=\"width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,.2);display:grid;place-items:center;font-size:14px;font-weight:600;flex:none\">DW<\u002Fspan>\n<span><span style=\"display:block;font-size:14.5px;font-weight:600;letter-spacing:-.01em\">Dana W.<\u002Fspan><span style=\"display:block;font-size:12.5px;color:rgba(255,255,255,.72)\">Homeowner · Spokane<\u002Fspan><\u002Fspan>\n<\u002Ffigcaption>\n<\u002Fli>\n<li style=\"flex:0 0 min(370px,82vw);scroll-snap-align:start;background:#4B1A3C;border-radius:22px;padding:26px;color:#fff;display:flex;flex-direction:column;gap:16px\">\n<span aria-hidden=\"true\" style=\"font-size:44px;line-height:.6;font-weight:600;color:rgba(255,255,255,.4)\">“<\u002Fspan>\n<blockquote style=\"font-size:16px;line-height:1.55;letter-spacing:-.01em;flex:1\">I'd been with the same company eleven years. Northgate re‑shopped it and found the same limits for $61 less a month. They showed me the comparison line by line.<\u002Fblockquote>\n<figcaption style=\"display:flex;align-items:center;gap:12px;padding-top:16px;border-top:1px solid rgba(255,255,255,.2)\">\n<span aria-hidden=\"true\" style=\"width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,.2);display:grid;place-items:center;font-size:14px;font-weight:600;flex:none\">RO<\u002Fspan>\n<span><span style=\"display:block;font-size:14.5px;font-weight:600;letter-spacing:-.01em\">Rosa O.<\u002Fspan><span style=\"display:block;font-size:12.5px;color:rgba(255,255,255,.72)\">Auto &amp; home · Coeur d'Alene<\u002Fspan><\u002Fspan>\n<\u002Ffigcaption>\n<\u002Fli>\n<li style=\"flex:0 0 min(370px,82vw);scroll-snap-align:start;background:#2C60F0;border-radius:22px;padding:26px;color:#fff;display:flex;flex-direction:column;gap:16px\">\n<span aria-hidden=\"true\" style=\"font-size:44px;line-height:.6;font-weight:600;color:rgba(255,255,255,.45)\">“<\u002Fspan>\n<blockquote style=\"font-size:16px;line-height:1.55;letter-spacing:-.01em;flex:1\">We needed a certificate of insurance the morning of a bid. Sent an email at 7:40, had it back before eight. That kind of thing wins you jobs.<\u002Fblockquote>\n<figcaption style=\"display:flex;align-items:center;gap:12px;padding-top:16px;border-top:1px solid rgba(255,255,255,.25)\">\n<span aria-hidden=\"true\" style=\"width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,.22);display:grid;place-items:center;font-size:14px;font-weight:600;flex:none\">TL<\u002Fspan>\n<span><span style=\"display:block;font-size:14.5px;font-weight:600;letter-spacing:-.01em\">Terrence L.<\u002Fspan><span style=\"display:block;font-size:12.5px;color:#fff\">Contractor · Post Falls<\u002Fspan><\u002Fspan>\n<\u002Ffigcaption>\n<\u002Fli>\n<li style=\"flex:0 0 min(370px,82vw);scroll-snap-align:start;background:#1C5B3E;border-radius:22px;padding:26px;color:#fff;display:flex;flex-direction:column;gap:16px\">\n<span aria-hidden=\"true\" style=\"font-size:44px;line-height:.6;font-weight:600;color:rgba(255,255,255,.4)\">“<\u002Fspan>\n<blockquote style=\"font-size:16px;line-height:1.55;letter-spacing:-.01em;flex:1\">Buying life insurance felt heavy until someone drew it on paper for me. Twenty‑year term, enough to cover the mortgage and the kids' school. Done in one sitting.<\u002Fblockquote>\n<figcaption style=\"display:flex;align-items:center;gap:12px;padding-top:16px;border-top:1px solid rgba(255,255,255,.2)\">\n<span aria-hidden=\"true\" style=\"width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,.2);display:grid;place-items:center;font-size:14px;font-weight:600;flex:none\">AK<\u002Fspan>\n<span><span style=\"display:block;font-size:14.5px;font-weight:600;letter-spacing:-.01em\">Amara K.<\u002Fspan><span style=\"display:block;font-size:12.5px;color:rgba(255,255,255,.72)\">Life policy · Cheney<\u002Fspan><\u002Fspan>\n<\u002Ffigcaption>\n<\u002Fli>\n<li style=\"flex:0 0 min(370px,82vw);scroll-snap-align:start;background:#4B1A3C;border-radius:22px;padding:26px;color:#fff;display:flex;flex-direction:column;gap:16px\">\n<span aria-hidden=\"true\" style=\"font-size:44px;line-height:.6;font-weight:600;color:rgba(255,255,255,.4)\">“<\u002Fspan>\n<blockquote style=\"font-size:16px;line-height:1.55;letter-spacing:-.01em;flex:1\">My son turned sixteen and I braced for the bill. They moved us to a carrier with a good‑student program and it barely moved. I would not have known to ask.<\u002Fblockquote>\n<figcaption style=\"display:flex;align-items:center;gap:12px;padding-top:16px;border-top:1px solid rgba(255,255,255,.2)\">\n<span aria-hidden=\"true\" style=\"width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,.2);display:grid;place-items:center;font-size:14px;font-weight:600;flex:none\">JP<\u002Fspan>\n<span><span style=\"display:block;font-size:14.5px;font-weight:600;letter-spacing:-.01em\">Joel P.<\u002Fspan><span style=\"display:block;font-size:12.5px;color:rgba(255,255,255,.72)\">Family auto · Liberty Lake<\u002Fspan><\u002Fspan>\n<\u002Ffigcaption>\n<\u002Fli>\n<\u002Ful>\n<\u002Fsection>\n\n<section id=\"faq\" style=\"max-width:1280px;margin:0 auto;padding:clamp(40px,6vw,80px) clamp(18px,4vw,48px);scroll-margin-top:86px\">\n<div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(330px,1fr));gap:clamp(28px,4vw,56px);align-items:start\">\n<div style=\"min-width:0;position:sticky;top:100px\">\n<p style=\"display:inline-flex;align-items:center;gap:8px;padding:6px 14px 6px 11px;border:1px solid rgba(20,21,15,.16);border-radius:999px;font-family:'DM Mono',ui-monospace,monospace;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:#5C5D56;margin-bottom:20px\">\n<span style=\"width:6px;height:6px;background:#2C60F0;border-radius:50%;display:block\"><\u002Fspan>Questions<\u002Fp>\n<h2 style=\"font-size:clamp(30px,4vw,48px);line-height:1.06;letter-spacing:-.032em;font-weight:500;margin-bottom:18px\">Clear answers, no fine‑print surprises<\u002Fh2>\n<p style=\"font-size:16px;line-height:1.6;color:#5C5D56;max-width:42ch;margin-bottom:26px\">Still stuck on something? Ask us directly — a licensed agent answers, not a chatbot.<\u002Fp>\n<a href=\"tel:+15095550142\" style=\"display:inline-flex;align-items:center;gap:11px;padding:9px 10px 9px 20px;border:1px solid rgba(20,21,15,.2);border-radius:999px;font-size:15px;font-weight:500;color:#14150F\" style-hover=\"background:#14150F;color:#fff;border-color:#14150F\">Call (509) 555‑0142\n<span style=\"width:28px;height:28px;border-radius:50%;background:rgba(20,21,15,.08);display:grid;place-items:center\"><svg width=\"12\" height=\"12\" sc-camel-view-box=\"0 0 12 12\" fill=\"none\" aria-hidden=\"true\"><path d=\"M2 6h8M6.5 2.5 10 6l-3.5 3.5\" stroke=\"currentColor\" stroke-width=\"1.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><\u002Fpath><\u002Fsvg><\u002Fspan>\n<\u002Fa>\n<\u002Fdiv>\n<ul style=\"display:grid;gap:10px;min-width:0\">\n<li style=\"background:#2C60F0;border-radius:18px;color:#fff;overflow:hidden\">\n<h3 style=\"margin:0\"><button type=\"button\" sc-camel-on-click=\"{{ toggleFaq0 }}\" aria-expanded=\"{{ faq0 }}\" aria-controls=\"faq-p-0\" style=\"width:100%;display:flex;align-items:center;justify-content:space-between;gap:16px;text-align:left;padding:18px 20px;font-size:16px;font-weight:500;letter-spacing:-.015em;line-height:1.35\" style-hover=\"background:rgba(255,255,255,.08)\">What does “independent agency” actually mean for me?\n<span aria-hidden=\"true\" style=\"width:30px;height:30px;border-radius:50%;background:rgba(255,255,255,.22);display:grid;place-items:center;flex:none;transition:transform .24s ease;transform:{{ faqRot0 }}\"><svg width=\"13\" height=\"13\" sc-camel-view-box=\"0 0 12 12\" fill=\"none\"><path d=\"M6 2v8M2 6h8\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\"><\u002Fpath><\u002Fsvg><\u002Fspan>\n<\u002Fbutton><\u002Fh3>\n<sc-if value=\"{{ faq0 }}\" hint-placeholder-val=\"{{ true }}\"><div id=\"faq-p-0\" style=\"padding:0 20px 20px;animation:om-in .24s ease both\"><p style=\"font-size:14.5px;line-height:1.6;color:rgba(255,255,255,.95);max-width:60ch\">We hold appointments with twelve carriers instead of working for one. You get a single point of contact who can compare all of them, and if a carrier raises your rate we can move you without you starting over.<\u002Fp><\u002Fdiv><\u002Fsc-if>\n<\u002Fli>\n<li style=\"background:#1C5B3E;border-radius:18px;color:#fff;overflow:hidden\">\n<h3 style=\"margin:0\"><button type=\"button\" sc-camel-on-click=\"{{ toggleFaq1 }}\" aria-expanded=\"{{ faq1 }}\" aria-controls=\"faq-p-1\" style=\"width:100%;display:flex;align-items:center;justify-content:space-between;gap:16px;text-align:left;padding:18px 20px;font-size:16px;font-weight:500;letter-spacing:-.015em;line-height:1.35\" style-hover=\"background:rgba(255,255,255,.08)\">How long does a quote take?\n<span aria-hidden=\"true\" style=\"width:30px;height:30px;border-radius:50%;background:rgba(255,255,255,.22);display:grid;place-items:center;flex:none;transition:transform .24s ease;transform:{{ faqRot1 }}\"><svg width=\"13\" height=\"13\" sc-camel-view-box=\"0 0 12 12\" fill=\"none\"><path d=\"M6 2v8M2 6h8\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\"><\u002Fpath><\u002Fsvg><\u002Fspan>\n<\u002Fbutton><\u002Fh3>\n<sc-if value=\"{{ faq1 }}\" hint-placeholder-val=\"{{ false }}\"><div id=\"faq-p-1\" style=\"padding:0 20px 20px;animation:om-in .24s ease both\"><p style=\"font-size:14.5px;line-height:1.6;color:rgba(255,255,255,.92);max-width:60ch\">The form takes about five minutes. Simple auto and renters quotes usually come back the same day; home, life and commercial files that need underwriting review take one to three business days.<\u002Fp><\u002Fdiv><\u002Fsc-if>\n<\u002Fli>\n<li style=\"background:#4B1A3C;border-radius:18px;color:#fff;overflow:hidden\">\n<h3 style=\"margin:0\"><button type=\"button\" sc-camel-on-click=\"{{ toggleFaq2 }}\" aria-expanded=\"{{ faq2 }}\" aria-controls=\"faq-p-2\" style=\"width:100%;display:flex;align-items:center;justify-content:space-between;gap:16px;text-align:left;padding:18px 20px;font-size:16px;font-weight:500;letter-spacing:-.015em;line-height:1.35\" style-hover=\"background:rgba(255,255,255,.08)\">Does switching mid‑term cost me anything?\n<span aria-hidden=\"true\" style=\"width:30px;height:30px;border-radius:50%;background:rgba(255,255,255,.22);display:grid;place-items:center;flex:none;transition:transform .24s ease;transform:{{ faqRot2 }}\"><svg width=\"13\" height=\"13\" sc-camel-view-box=\"0 0 12 12\" fill=\"none\"><path d=\"M6 2v8M2 6h8\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\"><\u002Fpath><\u002Fsvg><\u002Fspan>\n<\u002Fbutton><\u002Fh3>\n<sc-if value=\"{{ faq2 }}\" hint-placeholder-val=\"{{ false }}\"><div id=\"faq-p-2\" style=\"padding:0 20px 20px;animation:om-in .24s ease both\"><p style=\"font-size:14.5px;line-height:1.6;color:rgba(255,255,255,.92);max-width:60ch\">Almost never. Most carriers refund unused premium pro‑rata, and we time the new policy to start the day the old one ends so there's no gap. If a cancellation fee does apply, we tell you the number before you decide.<\u002Fp><\u002Fdiv><\u002Fsc-if>\n<\u002Fli>\n<li style=\"background:#2C60F0;border-radius:18px;color:#fff;overflow:hidden\">\n<h3 style=\"margin:0\"><button type=\"button\" sc-camel-on-click=\"{{ toggleFaq3 }}\" aria-expanded=\"{{ faq3 }}\" aria-controls=\"faq-p-3\" style=\"width:100%;display:flex;align-items:center;justify-content:space-between;gap:16px;text-align:left;padding:18px 20px;font-size:16px;font-weight:500;letter-spacing:-.015em;line-height:1.35\" style-hover=\"background:rgba(255,255,255,.08)\">Who handles my claim — you or the carrier?\n<span aria-hidden=\"true\" style=\"width:30px;height:30px;border-radius:50%;background:rgba(255,255,255,.22);display:grid;place-items:center;flex:none;transition:transform .24s ease;transform:{{ faqRot3 }}\"><svg width=\"13\" height=\"13\" sc-camel-view-box=\"0 0 12 12\" fill=\"none\"><path d=\"M6 2v8M2 6h8\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\"><\u002Fpath><\u002Fsvg><\u002Fspan>\n<\u002Fbutton><\u002Fh3>\n<sc-if value=\"{{ faq3 }}\" hint-placeholder-val=\"{{ false }}\"><div id=\"faq-p-3\" style=\"padding:0 20px 20px;animation:om-in .24s ease both\"><p style=\"font-size:14.5px;line-height:1.6;color:rgba(255,255,255,.95);max-width:60ch\">The carrier pays the claim, but we file it, track it and chase it. You call our office, not an 800 number — and if an estimate comes back low, your agent is the one on the phone with the adjuster.<\u002Fp><\u002Fdiv><\u002Fsc-if>\n<\u002Fli>\n<li style=\"background:#1C5B3E;border-radius:18px;color:#fff;overflow:hidden\">\n<h3 style=\"margin:0\"><button type=\"button\" sc-camel-on-click=\"{{ toggleFaq4 }}\" aria-expanded=\"{{ faq4 }}\" aria-controls=\"faq-p-4\" style=\"width:100%;display:flex;align-items:center;justify-content:space-between;gap:16px;text-align:left;padding:18px 20px;font-size:16px;font-weight:500;letter-spacing:-.015em;line-height:1.35\" style-hover=\"background:rgba(255,255,255,.08)\">Do you charge a fee for your advice?\n<span aria-hidden=\"true\" style=\"width:30px;height:30px;border-radius:50%;background:rgba(255,255,255,.22);display:grid;place-items:center;flex:none;transition:transform .24s ease;transform:{{ faqRot4 }}\"><svg width=\"13\" height=\"13\" sc-camel-view-box=\"0 0 12 12\" fill=\"none\"><path d=\"M6 2v8M2 6h8\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\"><\u002Fpath><\u002Fsvg><\u002Fspan>\n<\u002Fbutton><\u002Fh3>\n<sc-if value=\"{{ faq4 }}\" hint-placeholder-val=\"{{ false }}\"><div id=\"faq-p-4\" style=\"padding:0 20px 20px;animation:om-in .24s ease both\"><p style=\"font-size:14.5px;line-height:1.6;color:rgba(255,255,255,.92);max-width:60ch\">No. Quotes, reviews and claims help are free — we're paid a commission by whichever carrier you choose, and it's disclosed on your paperwork. It doesn't change what the policy costs you.<\u002Fp><\u002Fdiv><\u002Fsc-if>\n<\u002Fli>\n<li style=\"background:#4B1A3C;border-radius:18px;color:#fff;overflow:hidden\">\n<h3 style=\"margin:0\"><button type=\"button\" sc-camel-on-click=\"{{ toggleFaq5 }}\" aria-expanded=\"{{ faq5 }}\" aria-controls=\"faq-p-5\" style=\"width:100%;display:flex;align-items:center;justify-content:space-between;gap:16px;text-align:left;padding:18px 20px;font-size:16px;font-weight:500;letter-spacing:-.015em;line-height:1.35\" style-hover=\"background:rgba(255,255,255,.08)\">Which states are you licensed in?\n<span aria-hidden=\"true\" style=\"width:30px;height:30px;border-radius:50%;background:rgba(255,255,255,.22);display:grid;place-items:center;flex:none;transition:transform .24s ease;transform:{{ faqRot5 }}\"><svg width=\"13\" height=\"13\" sc-camel-view-box=\"0 0 12 12\" fill=\"none\"><path d=\"M6 2v8M2 6h8\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\"><\u002Fpath><\u002Fsvg><\u002Fspan>\n<\u002Fbutton><\u002Fh3>\n<sc-if value=\"{{ faq5 }}\" hint-placeholder-val=\"{{ false }}\"><div id=\"faq-p-5\" style=\"padding:0 20px 20px;animation:om-in .24s ease both\"><p style=\"font-size:14.5px;line-height:1.6;color:rgba(255,255,255,.92);max-width:60ch\">Washington, Idaho, Oregon, Montana, Nevada and Arizona. If you're moving to a state we don't hold a licence in, we'll hand you off to an independent agency we trust there.<\u002Fp><\u002Fdiv><\u002Fsc-if>\n<\u002Fli>\n<\u002Ful>\n<\u002Fdiv>\n<\u002Fsection>\n\n<section aria-labelledby=\"promo-h\" style=\"max-width:1280px;margin:0 auto;padding:clamp(40px,6vw,80px) clamp(18px,4vw,48px)\">\n<div style=\"background:#1C5B3E;border-radius:clamp(24px,3vw,34px);padding:clamp(26px,3.4vw,48px);display:grid;grid-template-columns:repeat(auto-fit,minmax( e Insurance Group LLC is an independent insurance agency licensed in WA, ID, OR, MT, NV and AZ. Quotes shown on this site are illustrative and are not offers of coverage or binding contracts. Coverage, discounts, limits and eligibility are determined by the issuing carrier and are subject to underwriting review, policy terms, conditions and exclusions. This page is a demonstration template — the agency name, licence numbers, contact details, statistics and testimonials are placeholders for illustration only.<\u002Fp>\n<\u002Fdiv>\n<\u002Ffooter>\n\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{\n  &quot;quoteFlow&quot;: {&quot;editor&quot;: &quot;enum&quot;, &quot;options&quot;: [&quot;stepped&quot;, &quot;single&quot;], &quot;default&quot;: &quot;stepped&quot;, &quot;tsType&quot;: &quot;'stepped' | 'single'&quot;, &quot;section&quot;: &quot;Quote form&quot;},\n  &quot;faqMode&quot;: {&quot;editor&quot;: &quot;enum&quot;, &quot;options&quot;: [&quot;single&quot;, &quot;multi&quot;], &quot;default&quot;: &quot;single&quot;, &quot;tsType&quot;: &quot;'single' | 'multi'&quot;, &quot;section&quot;: &quot;FAQ&quot;},\n  &quot;showTrustBand&quot;: {&quot;editor&quot;: &quot;boolean&quot;, &quot;default&quot;: true, &quot;tsType&quot;: &quot;boolean&quot;, &quot;section&quot;: &quot;Sections&quot;},\n  &quot;testimonialAutoplay&quot;: {&quot;editor&quot;: &quot;range&quot;, &quot;default&quot;: 0, &quot;min&quot;: 0, &quot;max&quot;: 12, &quot;step&quot;: 1, &quot;unit&quot;: &quot;s&quot;, &quot;tsType&quot;: &quot;number&quot;, &quot;section&quot;: &quot;Testimonials&quot;}\n}\">\nconst RING = 'inset 0 0 0 2px #2C60F0';\nconst ARROW = React.createElement('svg', {width:12, height:12, viewBox:'0 0 12 12', fill:'none','aria-hidden':'true'},\n  React.createElement('path', {d:'M2 6h8M6.5 2.5 10 6l-3.5 3.5', stroke:'currentColor', strokeWidth:1.5, strokeLinecap:'round', strokeLinejoin:'round'}));\nconst SPINNER = React.createElement('span', {style:{width:13, height:13, border:'2px solid rgba(255,255,255,.45)', borderTopColor:'#fff', borderRadius:'50%', display:'block', animation:'om-spin .7s linear infinite'}});\nconst CHECK = React.createElement('svg', {width:13, height:13, viewBox:'0 0 12 12', fill:'none','aria-hidden':'true'},\n  React.createElement('path', {d:'M2.5 6.2 4.8 8.5 9.5 3.8', stroke:'currentColor', strokeWidth:1.7, strokeLinecap:'round', strokeLinejoin:'round'}));\n\nconst LABELS = {\n  auto: 'Combined liability limit',\n  home: 'Dwelling coverage amount',\n  life: 'Death benefit',\n  business: 'General liability limit'\n};\nconst RATE = { auto: 0.0042, home: 0.0031, life: 0.00072, business: 0.0058 };\nconst NAMES = ['Coverage & location', 'Policy details', 'Your contact info'];\n\nclass Component extends DCLogic {\n  state = {\n    compact: false, navOpen: false,\n    faq: [true, false, false, false, false, false],\n    step: 0, touched: {}, sending: false, sent: false,\n    product: 'auto', zip: '', amount: 300000, insurer: '', renewal: '', bundle: true,\n    name: '', email: '', phone: '', contact: 'email',\n    news: '', newsState: 'idle', newsMsg: ''\n  };\n\n  constructor(props) {\n    super(props);\n    this.rail = React.createRef();\n  }\n\n  componentDidMount() {\n    this.mq = window.matchMedia('(max-width: 900px)');\n    this.onMq = () => this.setState({ compact: this.mq.matches, navOpen: false });\n    this.onMq();\n    this.mq.addEventListener('change', this.onMq);\n    this.tick();\n  }\n\n  componentDidUpdate(prev) {\n    if (prev.testimonialAutoplay !== this.props.testimonialAutoplay) this.tick();\n  }\n\n  componentWillUnmount() {\n    if (this.mq) this.mq.removeEventListener('change', this.onMq);\n    clearInterval(this.timer);\n    clearTimeout(this.sendTimer);\n    clearTimeout(this.newsTimer);\n    cancelAnimationFrame(this.raf);\n  }\n\n  tick() {\n    clearInterval(this.timer);\n    const secs = Number(this.props.testimonialAutoplay || 0);\n    if (secs > 0) this.timer = setInterval(() => this.scrollRail(1), secs * 1000);\n  }\n\n  scrollRail(dir) {\n    const el = this.rail.current;\n    if (!el) return;\n    const card = el.querySelector('li');\n    const step = card ? card.getBoundingClientRect().width + 16 : 380;\n    const max = el.scrollWidth - el.clientWidth;\n    const atEnd = el.scrollLeft >= max - 8;\n    const to = dir > 0 && atEnd ? 0 : Math.max(0, Math.min(max, el.scrollLeft + step * dir));\n    this.tween(el, to);\n  }\n\n  // scroll-snap-type cancels native smooth scrolling, so tween it ourselves\n  tween(el, to) {\n    cancelAnimationFrame(this.raf);\n    const from = el.scrollLeft;\n    const dist = to - from;\n    if (!dist) return;\n    const t0 = performance.now();\n    const dur = Math.min(650, 240 + Math.abs(dist) * 0.5);\n    const frame = now => {\n      const t = Math.min(1, (now - t0) / dur);\n      el.scrollLeft = from + dist * (t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2);\n      if (t < 1) this.raf = requestAnimationFrame(frame);\n    };\n    this.raf = requestAnimationFrame(frame);\n  }\n\n  set(k) { return e => this.setState({ [k]: e.target.value }); }\n\n  // ---- validation -------------------------------------------------------\n  errors() {\n    const s = this.state;\n    const e = {};\n    if (!/^\\d{5}$/.test(s.zip.trim())) e.zip = 'Enter a 5-digit ZIP code so we know which carriers are available.';\n    if (s.name.trim().length < 2) e.name = 'Please tell us your name.';\n    if (!/^[^\\s@]+@[^\\s@]+\\.[^\\s@]{2,}$/.test(s.email.trim())) e.email = 'That email address looks incomplete.';\n    const digits = s.phone.replace(/\\D/g, '');\n    if (s.contact !== 'email' && digits.length < 10) e.phone = 'A 10-digit number is needed for a call or text.';\n    else if (s.phone.trim() && digits.length < 10) e.phone = 'That phone number looks too short.';\n    return e;\n  }\n\n  stepFields(step) {\n    return step === 0 ? ['zip'] : step === 1 ? [] : ['name', 'email', 'phone'];\n  }\n\n  visibleErrors() {\n    const all = this.errors();\n    const out = {};\n    Object.keys(all).forEach(k => { if (this.state.touched[k]) out[k] = all[k]; });\n    return out;\n  }\n\n  touch(keys) {\n    const t = Object.assign({}, this.state.touched);\n    keys.forEach(k => { t[k] = true; });\n    this.setState({ touched: t });\n  }\n\n  next = () => {\n    const fields = this.stepFields(this.state.step);\n    this.touch(fields);\n    const all = this.errors();\n    if (fields.some(f => all[f])) return;\n    this.setState(s => ({ step: Math.min(2, s.step + 1) }));\n  };\n\n  back = () => this.setState(s => ({ step: Math.max(0, s.step - 1) }));\n\n  onSubmit = e => {\n    e.preventDefault();\n    this.touch(['zip', 'name', 'email', 'phone']);\n    const all = this.errors();\n    if (Object.keys(all).length) {\n      if (all.zip && this.props.quoteFlow !== 'single') this.setState({ step: 0 });\n      return;\n    }\n    this.setState({ sending: true });\n    this.sendTimer = setTimeout(() => this.setState({ sending: false, sent: true }), 1500);\n  };\n\n  resetQuote = () => this.setState({\n    sent: false, step: 0, touched: {}, zip: '', name: '', email: '', phone: '',\n    insurer: '', renewal: '', amount: 300000, product: 'auto', contact: 'email'\n  });\n\n  onNewsletter = e => {\n    e.preventDefault();\n    const ok = /^[^\\s@]+@[^\\s@]+\\.[^\\s@]{2,}$/.test(this.state.news.trim());\n    if (!ok) { this.setState({ newsState: 'error', newsMsg: 'Please enter a valid email address.' }); return; }\n    this.setState({ newsState: 'loading', newsMsg: '' });\n    this.newsTimer = setTimeout(() => this.setState({\n      newsState: 'done', newsMsg: 'You’re on the list — first note arrives at the start of next month.'\n    }), 1200);\n  };\n\n  toggleFaq(i) {\n    this.setState(s => {\n      const multi = this.props.faqMode === 'multi';\n      const faq = multi ? s.faq.slice() : s.faq.map(() => false);\n      faq[i] = multi ? !s.faq[i] : !s.faq[i];\n      return { faq };\n    });\n  }\n\n  money(n) {\n    return n >= 1000000 ? '$' + (n / 1000000).toFixed(n % 1000000 === 0 ? 0 : 2) + 'M' : '$' + Math.round(n / 1000) + 'k';\n  }\n\n  renderVals() {\n    const s = this.state;\n    const p = this.props;\n    const stepped = (p.quoteFlow ?? 'stepped') === 'stepped';\n    const err = this.visibleErrors();\n    const ring = k => (err[k] ? 'inset 0 0 0 2px #B0233C' : undefined);\n\n    const base = Math.round(s.amount * (RATE[s.product] || 0.004) / 12 * (s.bundle ? 0.86 : 1));\n    const low = Math.max(28, Math.round(base * 0.85 / 5) * 5);\n    const high = Math.round(base * 1.25 / 5) * 5;\n\n    const v = {\n      compact: s.compact, wide: !s.compact, navOpen: s.navOpen,\n      toggleNav: () => this.setState(x => ({ navOpen: !x.navOpen })),\n      closeNav: () => this.setState({ navOpen: false }),\n      showTrustBand: p.showTrustBand ?? true,\n\n      rail: this.rail,\n      prev: () => this.scrollRail(-1),\n      next2: () => this.scrollRail(1),\n\n      // quote form\n      stepped,\n      sent: s.sent, notSent: !s.sent, sending: s.sending,\n      show1: !stepped || s.step === 0,\n      show2: !stepped || s.step === 1,\n      show3: !stepped || s.step === 2,\n      canGoBack: stepped && s.step > 0,\n      showNext: stepped && s.step < 2,\n      showSubmit: !stepped || s.step === 2,\n      stepLabel: 'Step ' + (s.step + 1) + ' of 3',\n      stepName: NAMES[s.step],\n      progress: Math.round((s.step + 1) / 3 * 100) + '%',\n      submitLabel: s.sending ? 'Sending…' : 'Send my request',\n      submitIcon: s.sending ? SPINNER : ARROW,\n      submitOpacity: s.sending ? 0.65 : 1,\n      onSubmit: this.onSubmit, next: this.next, back: this.back, resetQuote: this.resetQuote,\n\n      product: s.product,\n      isAuto: s.product === 'auto', isHome: s.product === 'home',\n      isLife: s.product === 'life', isBiz: s.product === 'business',\n      ringAuto: s.product === 'auto' ? RING : undefined,\n      ringHome: s.product === 'home' ? RING : undefined,\n      ringLife: s.product === 'life' ? RING : undefined,\n      ringBiz: s.product === 'business' ? RING : undefined,\n      onProduct: e => this.setState({ product: e.target.value }),\n\n      zip: s.zip,\n      onZip: e => this.setState({ zip: e.target.value.replace(/[^\\d]/g, '').slice(0, 5), touched: Object.assign({}, s.touched, { zip: true }) }),\n      zipError: err.zip || '', zipInvalid: !!err.zip, zipRing: ring('zip'),\n\n      amount: s.amount,\n      amountText: this.money(s.amount),\n      amountLabel: LABELS[s.product],\n      onAmount: e => this.setState({ amount: Number(e.target.value) }),\n\n      insurer: s.insurer, onInsurer: this.set('insurer'),\n      renewal: s.renewal, onRenewal: this.set('renewal'),\n      bundle: s.bundle,\n      bundleTrack: s.bundle ? '#7A3CE8' : 'rgba(20,21,15,.22)',\n      bundleKnob: s.bundle ? '21px' : '3px',\n      bundleRing: s.bundle ? 'inset 0 0 0 2px #7A3CE8' : undefined,\n      toggleBundle: () => this.setState(x => ({ bundle: !x.bundle })),\n\n      name: s.name, onName: e => this.setState({ name: e.target.value, touched: Object.assign({}, s.touched, { name: true }) }),\n      nameError: err.name || '', nameInvalid: !!err.name, nameRing: ring('name'),\n      email: s.email, onEmail: e => this.setState({ email: e.target.value, touched: Object.assign({}, s.touched, { email: true }) }),\n      emailError: err.email || '', emailInvalid: !!err.email, emailRing: ring('email'),\n      phone: s.phone, onPhone: e => this.setState({ phone: e.target.value, touched: Object.assign({}, s.touched, { phone: true }) }),\n      phoneError: err.phone || '', phoneInvalid: !!err.phone, phoneRing: ring('phone'),\n\n      prefEmail: s.contact === 'email', prefPhone: s.contact === 'phone', prefText: s.contact === 'text',\n      ringEmail: s.contact === 'email' ? RING : undefined,\n      ringPhone: s.contact === 'phone' ? RING : undefined,\n      ringText: s.contact === 'text' ? RING : undefined,\n      onContact: e => this.setState({ contact: e.target.value }),\n\n      estimate: '$' + low + '–' + high + ' / month',\n      successLine: (s.name.trim().split(' ')[0] || 'Thanks') + ', your file is with a licensed agent now. We’ll ' +\n        (s.contact === 'email' ? 'email' : s.contact === 'phone' ? 'call' : 'text') + ' you within one business day with real carrier numbers.',\n\n      // newsletter\n      news: s.news,\n      onNews: e => this.setState({ news: e.target.value, newsState: 'idle', newsMsg: '' }),\n      onNewsletter: this.onNewsletter,\n      newsBusy: s.newsState === 'loading' || s.newsState === 'done',\n      newsOpacity: s.newsState === 'loading' ? 0.65 : 1,\n      newsLabel: s.newsState === 'loading' ? 'Signing up…' : s.newsState === 'done' ? 'Subscribed' : 'Subscribe',\n      newsIcon: s.newsState === 'loading' ? SPINNER : s.newsState === 'done' ? CHECK : ARROW,\n      newsMsg: s.newsMsg,\n      newsInvalid: s.newsState === 'error',\n      newsMsgColor: s.newsState === 'error' ? '#8A1730' : '#2E5233',\n      newsRing: s.newsState === 'error' ? 'inset 0 0 0 2px #B0233C' : undefined\n    };\n\n    s.faq.forEach((open, i) => {\n      v['faq' + i] = open;\n      v['faqRot' + i] = open ? 'rotate(45deg)' : 'rotate(0deg)';\n      v['toggleFaq' + i] = () => this.toggleFaq(i);\n    });\n\n    return v;\n  }\n}\n\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
